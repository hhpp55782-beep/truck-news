 "kws": ["重卡", "电动重卡", "重卡政策"]}, {"t": "宁德时代换电站扩展至70+城市，长期目标建成3-4万座换电站", "s": "宁德时代宣布2026年将换电站网络扩展至70个以上城市，保有量突破1500座，并披露最终将建成3至4万座换电站的长期规划，构建覆盖全国的重型商用车换电服务网络。", "time": "old", "stars": 4, "src": "宁德时代/证券时报", "url": "https://stcn.com/article/detail/1461612.html", "kws": ["换电站", "电动重卡", "充电站 技术"]}, {"t": "国四淘汰潮来袭：52万辆国四重卡待置换，2026年新能源渗透率或达35%", "s": "中国重汽预测国内现存52万辆国四重卡将在2026年迎来集中更新周期，在补贴政策和排放标准双重驱动下，2026年重卡市场新能源渗透率有望达到35%。", "time": "old", "stars": 4, "src": "每经网", "url": "https://www.nbd.com.cn/articles/2025-12-19/4187594.html", "kws": ["重卡", "重卡政策", "新能源重卡"]}, {"t": "康迪科技再度携手宁德时代，联手布局重卡换电站市场", "s": "康迪科技宣布再次与宁德时代达成战略合作，共同布局重卡换电站建设与运营，加速在重要物流节点和港口矿区等高频重卡使用场景落地换电基础设施。", "time": "old", "stars": 3, "src": "观察者网", "url": "https://www.guancha.cn/economy/2026_01_30_805552.shtml", "kws": ["换电站", "重卡", "电动重卡"]}, {"t": "河南省2026年计划开工100个充换电站，打造零碳运输干线通道", "s": "河南省明确2026年将开工建设100个充换电站，重点支撑京港澳、连霍等国家重要运输通道绿色化改造，打造零碳运输干线走廊，带动沿线重卡运营企业加快新能源化转型。", "time": "old", "stars": 3, "src": "国际充换电网", "url": "https://mchd.in-en.com/html/chd-2457392.shtml", "kws": ["充电站 政策", "换电站", "运输 政策"]}, {"t": "2026第五届中国新能源重卡产业大会召开，智能化成核心议题", "s": "以智能引领穿越场景为主题的第五届中国新能源重卡产业大会成功举办，行业从规模化扩张走向智能化深耕，智能驾驶、多场景适配和商业化落地成为核心议题。", "time": "old", "stars": 3, "src": "洋葱商用车", "url": "https://m.361cv.com/article/13370.html", "kws": ["新能源重卡", "重卡", "电动重卡"]}, {"t": "超充技术突破：太湖服务区超充站最高输出480kW，效率是传统快充4倍", "s": "太湖服务区超充站支持一车双枪，最高输出480千瓦，效率是传统快充4倍，采用华为光储充一体化方案，成为高速公路服务区绿色智慧能源补给样板。", "time": "old", "stars": 3, "src": "人民财经网", "url": "https://www.peoplecen.com/html/2026/zhengj_0202/25654.html", "kws": ["充电站 技术", "充电站", "运输 政策"]}, {"t": "蔚来换电站突破3727座，V2G单站充放电功率可达500千瓦", "s": "截至2026年初蔚来能源已建成3727座换电站，最新一代换电站配合V2G设备单站充放电功率达500千瓦，100座同步运行相当于5万千瓦储能电站，正向重卡领域加速渗透。", "time": "old", "stars": 3, "src": "蔚来", "url": "https://www.nio.cn/official-map", "kws": ["换电站", "充电站 技术"]}, {"t": "2025-2026物流业全景：中小承运商加速退出，专业化路线成存活关键", "s": "预计2026年将有15%-20%的中小承运商退出市场，新规要求12吨以上货车强制安装视频动态监控和防疲劳驾驶系统，将加速行业合规化，倒逼运营企业加快新能源化改造。", "time": "old", "stars": 3, "src": "新浪财经", "url": "https://finance.sina.com.cn/roll/2026-02-26/doc-inhpcush7277870.shtml", "kws": ["物流 政策", "运输 政策", "重卡"]}];
var allKws = ["全部", "重卡", "电动重卡", "新能源重卡", "充电站", "换电站", "重卡政策", "重卡标准", "充电站 标准", "充电站 政策", "物流 政策", "充电站 技术", "运输 政策"];
var curTime='all', curKw='全部', curMinS=0;

var td=document.getElementById('tagsDiv');
var tl=document.createElement('label');
tl.textContent='🏷️ 关键词：';
td.appendChild(tl);
allKws.forEach(function(k){
  var b=document.createElement('button');
  b.className='fbtn'+(k==='全部'?' ag':'');
  b.textContent=k;
  b.setAttribute('data-kw',k);
  b.onclick=function(){
    document.querySelectorAll('[data-kw]').forEach(function(x){x.classList.remove('ag');});
    b.classList.add('ag');
    curKw=k; render();
  };
  td.appendChild(b);
});

function setTime(v,el){
  ['ta','t1','t2','t3'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('ab');});
  el.classList.add('ab'); curTime=v; render();
}
function setHot(v,el){
  ['h0','h4','h5'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('ab');});
  el.classList.add('ab'); curMinS=v; render();
}
function badge(t){
  if(t==='1h') return '<span class="tb t1h">🔴 1小时内</span>';
  if(t==='1d') return '<span class="tb t1d">🟠 1天内</span>';
  if(t==='1w') return '<span class="tb t1w">🟢 1周内</span>';
  return '<span class="tb told">⚪ 历史资讯</span>';
}
function stars(n){
  var s='';
  for(var i=1;i<=5;i++) s+='<span class="'+(i<=n?'sf':'se')+'">★</span>';
  return s;
}
function render(){
  var g=document.getElementById('grid');
  var r=D.filter(function(n){
    if(curTime!=='all'&&n.time!==curTime) return false;
    if(curKw!=='全部'&&n.kws.indexOf(curKw)===-1) return false;
    if(n.stars<curMinS) return false;
    return true;
  });
  var cnt=document.getElementById('cnt');
  if(cnt) cnt.textContent='显示 '+r.length+' / '+D.length+' 条资讯';
  if(!r.length){
    g.innerHTML='<div class="nores">😔 当前筛选条件下暂无资讯</div>';
    return;
  }
  r.sort(function(a,b){return b.stars-a.stars;});
  g.innerHTML=r.map(function(n){
    return '<div class="card s'+n.stars+'">'+
      '<div class="ch">'+
        '<div class="ctitle">'+n.t+'</div>'+
        '<div class="cmeta">'+badge(n.time)+'<div>'+stars(n.stars)+'</div></div>'+
      '</div>'+
      '<div class="cs">'+n.s+'</div>'+
      '<div class="cf">'+
        n.kws.map(function(k){return '<span class="kt">'+k+'</span>';}).join('')+
        '<div class="src-block">'+
          '<span class="src-name">📰 '+n.src+'</span>'+
          '<a class="src-link" href="'+n.url+'" target="_blank">查看原文 ↗</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
render();
</script>
